<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品图片提取</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-left">
        <h1>商品图片</h1>
        <p id="source-meta" class="meta">正在载入…</p>
      </div>
      <div class="toolbar-actions">
        <span id="selected-count" class="count">已选 0 / 0</span>
        <button type="button" id="btn-all" class="btn ghost" title="已全选时点击可取消全选">全选</button>
        <button type="button" id="btn-invert" class="btn ghost">反选</button>
        <button type="button" id="btn-download" class="btn primary">下载选中</button>
      </div>
    </header>

    <main>
      <p id="empty-state" class="empty hidden">没有可展示的图片。请回到商品详情页点击「获取图片」。</p>
      <section id="grid" class="grid" aria-live="polite"></section>
    </main>

    <div id="progress-mask" class="mask hidden" role="status" aria-live="polite">
      <div class="panel">
        <p id="progress-text">准备下载…</p>
        <div class="bar">
          <div id="progress-bar" class="bar-fill"></div>
        </div>
        <p id="progress-sub" class="sub"></p>
      </div>
    </div>

    <script src="gallery.js"></script>
  </body>
</html>
